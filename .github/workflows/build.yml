name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bundle targets Java 8 bytecode; 11 is what AEM 6.5 runs on.
        java: ['8', '11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Resolves com.adobe.aem:uber-jar from repo.adobe.com via the
      # adobe-public profile, which the parent pom activates by default.
      - name: Build and test
        working-directory: aem-6.5-connector
        run: mvn -B -ntp verify

      - name: Upload content packages
        if: matrix.java == '11'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: content-packages
          path: aem-6.5-connector/**/target/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: aem-6.5-connector/**/target/surefire-reports/**
